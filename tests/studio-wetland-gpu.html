<!doctype html>
<meta charset="utf-8">
<title>Wind Garden terrain agreement</title>
<pre id="result">Checking terrain height on the GPU…</pre>
<script type="module">
import {Wetland, wetlandGLSL} from '../src/asset-studio/wetland.js';

function check(){
 const gl=document.createElement('canvas').getContext('webgl2',{antialias:false});
 if(!gl)throw Error('WebGL 2 unavailable');
 const program=gl.createProgram();
 function shader(type,source){
  const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));
  gl.attachShader(program,s);gl.deleteShader(s);
 }
 shader(gl.VERTEX_SHADER,'#version 300 es\nprecision highp float; precision highp int;\n'+wetlandGLSL+
  '\nlayout(location=0) in vec2 samplePosition; out float elevation; void main(){elevation=landHeight(samplePosition);gl_Position=vec4(0,0,0,1);gl_PointSize=1.;}');
 shader(gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;out vec4 color;void main(){color=vec4(0); }');
 gl.transformFeedbackVaryings(program,['elevation'],gl.INTERLEAVED_ATTRIBS);gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
 const input=gl.createBuffer(),output=gl.createBuffer(),samples=new Float32Array(64*2);
 for(let i=0;i<64;i++){
  const radius=i<24?1:i<48?20:1300;
  samples[2*i]=radius*Math.sin(i*5.37);samples[2*i+1]=radius*Math.cos(i*2.41);
 }
 gl.bindBuffer(gl.ARRAY_BUFFER,input);gl.bufferData(gl.ARRAY_BUFFER,samples,gl.STATIC_DRAW);
 gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER,output);gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER,64*4,gl.STREAM_READ);
 gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER,0,output);
 gl.useProgram(program);gl.enable(gl.RASTERIZER_DISCARD);
 let maxError=0;
 const rows=new Float32Array(64);
 for(const seed of [0,2187,0xffffffff]){
  const land=new Wetland(seed);
  gl.uniform2f(gl.getUniformLocation(program,'survey'),land.x,land.z);
  gl.beginTransformFeedback(gl.POINTS);gl.drawArrays(gl.POINTS,0,64);gl.endTransformFeedback();
  gl.getBufferSubData(gl.TRANSFORM_FEEDBACK_BUFFER,0,rows);
  for(let i=0;i<64;i++)maxError=Math.max(maxError,Math.abs(land.height(samples[2*i],samples[2*i+1])-rows[i]));
 }
 gl.disable(gl.RASTERIZER_DISCARD);
 const glError=gl.getError();gl.deleteBuffer(input);gl.deleteBuffer(output);gl.deleteProgram(program);
 return {pass:maxError<.003&&glError===0,points:192,maximumErrorMetres:maxError,glError};
}
try{document.querySelector('#result').textContent=JSON.stringify(check(),null,2);}
catch(error){document.querySelector('#result').textContent=String(error);}
</script>
