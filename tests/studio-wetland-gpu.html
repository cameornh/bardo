<!doctype html>
<meta charset="utf-8">
<title>Shell Island Beach terrain and coastal fields agreement</title>
<pre id="result">Checking terrain elevation and coastal fields on the GPU…</pre>
<script type="module">
import {Wetland, wetlandGLSL, coastalFieldsGLSL} from '../src/asset-studio/wetland.js';

function linkProgram(gl, vsSource, varyings) {
 const program = gl.createProgram();
 function shader(type, source) {
  const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(s));
  gl.attachShader(program, s); gl.deleteShader(s);
 }
 shader(gl.VERTEX_SHADER, vsSource);
 shader(gl.FRAGMENT_SHADER, '#version 300 es\nprecision highp float;out vec4 color;void main(){color=vec4(0);}');
 gl.transformFeedbackVaryings(program, varyings, gl.INTERLEAVED_ATTRIBS);
 gl.linkProgram(program);
 if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(program));
 return program;
}

function check() {
 const gl = document.createElement('canvas').getContext('webgl2', {antialias: false});
 if (!gl) throw Error('WebGL 2 unavailable');

 // Pass 1: Standalone wetlandGLSL elevation check (requires only survey)
 const elevProg = linkProgram(gl, '#version 300 es\nprecision highp float; precision highp int;\n' + wetlandGLSL +
  '\nlayout(location=0) in vec2 samplePosition; out float elevation; void main(){elevation=landHeight(samplePosition);gl_Position=vec4(0,0,0,1);gl_PointSize=1.;}',
  ['elevation']);

 // Pass 2: Full coastalFieldsGLSL check (8 continuous fields)
 const fieldsProg = linkProgram(gl, '#version 300 es\nprecision highp float; precision highp int;\n' + wetlandGLSL + coastalFieldsGLSL +
  `\nlayout(location=0) in vec2 samplePosition;
  out vec4 fieldA; out vec4 fieldB;
  void main(){
   float h=landHeight(samplePosition);
   float slope=length(vec2(landHeight(samplePosition+vec2(.4,0.))-h,landHeight(samplePosition+vec2(0.,.4))-h)/.4);
   CoastalField f=sampleCoastalField(samplePosition,h,slope);
   fieldA=vec4(f.waterTable,f.moisture,f.salinity,f.windExposure);
   fieldB=vec4(f.saltSpray,f.sandMobility,f.organicMatter,f.rosemaryInhibition);
   gl_Position=vec4(0,0,0,1);gl_PointSize=1.;
  }`, ['fieldA', 'fieldB']);

 const count = 64;
 const input = gl.createBuffer(), outElev = gl.createBuffer(), outFields = gl.createBuffer();
 const samples = new Float32Array(count * 2);
 for (let i = 0; i < count; i++) {
  const radius = i < 24 ? 1 : i < 48 ? 28 : 1300;
  samples[2 * i] = radius * Math.sin(i * 5.37);
  samples[2 * i + 1] = radius * Math.cos(i * 2.41);
 }

 gl.bindBuffer(gl.ARRAY_BUFFER, input);
 gl.bufferData(gl.ARRAY_BUFFER, samples, gl.STATIC_DRAW);
 gl.enableVertexAttribArray(0);
 gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

 gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, outElev);
 gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, count * 4, gl.STREAM_READ);
 gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, outFields);
 gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, count * 32, gl.STREAM_READ);

 gl.enable(gl.RASTERIZER_DISCARD);
 let maxError = 0;
 const fieldKeys = ['waterTable', 'moisture', 'salinity', 'windExposure', 'saltSpray', 'sandMobility', 'organicMatter', 'rosemaryInhibition'];
 const maxFieldErrors = Object.fromEntries(fieldKeys.map(k => [k, 0]));
 const elevRows = new Float32Array(count);
 const fieldRows = new Float32Array(count * 8);

 for (const seed of [0, 2187, 0xffffffff]) {
  const land = new Wetland(seed);

  gl.useProgram(elevProg);
  gl.uniform2f(gl.getUniformLocation(elevProg, 'survey'), land.x, land.z);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, outElev);
  gl.beginTransformFeedback(gl.POINTS); gl.drawArrays(gl.POINTS, 0, count); gl.endTransformFeedback();
  gl.getBufferSubData(gl.TRANSFORM_FEEDBACK_BUFFER, 0, elevRows);

  gl.useProgram(fieldsProg);
  gl.uniform2f(gl.getUniformLocation(fieldsProg, 'survey'), land.x, land.z);
  const {seaLevelOffset} = land.climate, h = land.hydrology;
  gl.uniform4f(gl.getUniformLocation(fieldsProg, 'coastalClimateA'), seaLevelOffset, h.lensHeight, h.capillaryFringe, h.saltScale);
  gl.uniform4f(gl.getUniformLocation(fieldsProg, 'coastalClimateB'), h.moistureIndex, land.windDirX, land.windDirZ, h.sandScale);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, outFields);
  gl.beginTransformFeedback(gl.POINTS); gl.drawArrays(gl.POINTS, 0, count); gl.endTransformFeedback();
  gl.getBufferSubData(gl.TRANSFORM_FEEDBACK_BUFFER, 0, fieldRows);

  for (let i = 0; i < count; i++) {
   const x = samples[2 * i], z = samples[2 * i + 1];
   maxError = Math.max(maxError, Math.abs(land.height(x, z) - elevRows[i]));
   const env = land.environment(x, z);
   fieldKeys.forEach((k, idx) => {
    maxFieldErrors[k] = Math.max(maxFieldErrors[k], Math.abs(env[k] - fieldRows[i * 8 + idx]));
   });
  }
 }

 gl.disable(gl.RASTERIZER_DISCARD);
 const glError = gl.getError();
 gl.deleteBuffer(input); gl.deleteBuffer(outElev); gl.deleteBuffer(outFields);
 gl.deleteProgram(elevProg); gl.deleteProgram(fieldsProg);

 const maxFieldError = Math.max(...Object.values(maxFieldErrors));
 return {
  pass: maxError < .003 && maxFieldError < .005 && glError === 0,
  points: count * 3,
  maximumErrorMetres: maxError,
  maximumFieldError: maxFieldError,
  fieldErrors: maxFieldErrors,
  glError
 };
}

try { document.querySelector('#result').textContent = JSON.stringify(check(), null, 2); }
catch (error) { document.querySelector('#result').textContent = String(error); }
</script>
