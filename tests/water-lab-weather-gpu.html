<!doctype html><html><head><style>body{margin:0;background:#20262a;color:#dde3e8;font:12px monospace}canvas{max-width:100%;height:auto}pre{white-space:pre-wrap;max-height:220px;overflow:auto}</style></head><body>
<button id="density">Validate bulk constraints</button><button id="validate">Validate weather GPU / CPU</button><button id="pane">Pane rain / splash</button><button id="underwater">Underwater foam</button><button id="waterfall">Waterfall mist</button><button id="player">Player displacement</button><button id="rain">Coarse heavy rain</button><button id="run">Run / pause</button><button id="wipe">Wipe camera</button><pre id="result">Ready</pre><script type="module">
import {labAirVelocity} from '../src/water-lab-air.js';
import {LabDetail} from '../src/water-lab-detail.js';
import * as THREE from 'three';
import {WaterLab} from '../src/water-lab.js';
import {WaterLabRenderer} from '../src/water-lab-renderer.js';
import {LabPoolShadows,POOL_SHADOW_GLSL} from '../src/water-lab-pool-shadows.js';
import {BODY_SHADOW_GLSL,bodyLightTransmission} from '../src/water-lab-body-shadows.js';
import {LAB_GEOMETRY_GLSL} from '../src/water-lab-model.js';
import {DETAIL_LIGHT_GLSL,detailResponse,detailRadiance,detailViewTransport,detailClusterResponse} from '../src/water-lab-detail-optics.js';
import {LAB_LIGHT_VISIBILITY_GLSL} from '../src/water-lab-light-visibility.js';
import {MotionDetail} from '../src/lod.js';
import {QUAD_VERTEX,TONEMAP_FRAGMENT} from '../src/shaders.js';
const renderer=new THREE.WebGLRenderer({preserveDrawingBuffer:true});renderer.autoClear=false;renderer.setSize(640,480);document.body.append(renderer.domElement);
renderer.debug.onShaderError=(gl,program,vs,fs)=>{throw new Error(gl.getShaderInfoLog(fs)||gl.getShaderInfoLog(vs)||gl.getProgramInfoLog(program));};
const lab=new WaterLab(renderer),camera=new THREE.PerspectiveCamera(43,640/480,.01,200),target=new THREE.WebGLRenderTarget(640,480,{type:THREE.FloatType}),output=new THREE.Scene();
output.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({glslVersion:THREE.GLSL3,vertexShader:QUAD_VERTEX,fragmentShader:TONEMAP_FRAGMENT,uniforms:{uImage:{value:target.texture}},depthTest:false,depthWrite:false})));
const field={renderer,camera,target,output,quadCamera:new THREE.Camera(),resolution:new THREE.Vector2(640,480),motion:new MotionDetail(),minPixelSigma:2,uniforms:{uView:{value:0},uSHDegree:{value:3}},water:{uniforms:{uWaterRoughness:{value:.07},uTurbidity:{value:.02}}}};
for(const k of ['beach','grass','grains','soft','optics','lightTest'])field[k]={count:0};
const visual=new WaterLabRenderer(field,lab),result=document.querySelector('#result');

let running=false,errors=[];window.addEventListener('error',e=>{errors.push(e.message);result.textContent='FAIL '+errors.join('\n');});
const read=(t,attachment=0)=>{const half=t.texture.type===THREE.HalfFloatType,a=half?new Uint16Array(t.width*t.height*4):new Float32Array(t.width*t.height*4);renderer.readRenderTargetPixels(t,0,0,t.width,t.height,a,0,attachment);return half?Float32Array.from(a,THREE.DataUtils.fromHalfFloat):a;};
const draw=()=>{camera.updateMatrixWorld();lab.wetting.setCamera(camera);visual.render({adaptive:false});};
const station=kind=>{running=false;lab.configure(kind);lab.detail.enabled=true;camera.position.fromArray(lab.spec.eye);camera.lookAt(...lab.spec.target);lab.enabled=true;draw();};
const ledger=()=>lab.volume+lab.rain.unresolvedVolume*lab.spec.scale**3-lab.initialVolume-lab.rain.emitted*lab.spec.scale**3;
async function steps(n){for(let i=0;i<n;i++){lab.step(lab.timestep);if(i%1===0){result.textContent='Simulating '+i+'/'+n;await new Promise(r=>setTimeout(r,0));}}draw();}
function summary(){return {kind:lab.kind,count:lab.count,detail:lab.detail.count,mist:lab.detail.mistEmitted,wetSpots:lab.wetting.glassSpots().length,lens:lab.wetting.lens.length,rainHits:lab.rain.hits,massDrift:ledger(),finite:lab.positions.every(Number.isFinite)&&lab.velocities.every(Number.isFinite),peakSpeed:Math.max(0,...Array.from({length:lab.count},(_,i)=>Math.hypot(...lab.velocities.subarray(i*4,i*4+3))))};}
document.querySelector('#density').onclick=()=>{result.textContent=JSON.stringify(lab.verify(),null,2);};
document.querySelector('#validate').onclick=async()=>{try{const comparisons=[];for(const kind of ['pane','pipe','ocean']){station(kind);lab.wind=25;lab.windTurbulence=2.2;lab.motion.tilt=.43;lab.motion.spin=.27;lab.motion.pitch=.31;lab.syncUniforms();lab.air.update(lab);const values=read(lab.air.target),min=lab.air.u.uAirMin.value.toArray(),span=lab.air.u.uAirExtent.value.toArray();let error=0;for(let i=0;i<250;i++){const x=(i*13)%32,y=(i*7)%24,z=(i*17)%32,p=[x,y,z].map((v,k)=>min[k]+v/[31,23,31][k]*span[k]),cpu=labAirVelocity(p,lab),o=(y*1024+x+z*32)*4;for(let k=0;k<3;k++)error=Math.max(error,Math.abs(cpu[k]-values[o+k]));}comparisons.push({kind,error,pass:error<.003});}
const detail=await LabDetail.verify(renderer);station('pane');lab.rain.douse();await steps(100);const pane=summary();result.textContent=JSON.stringify({pass:comparisons.every(v=>v.pass)&&detail.pass&&pane.finite&&Math.abs(pane.massDrift)<1e-8,air:comparisons,detail,pane},null,2);}catch(e){result.textContent='FAIL '+e.stack;}};
document.querySelector('#pane').onclick=async()=>{try{station('pane');lab.motion.tilt=lab.motion.targetTilt=.5;lab.rain.enabled=true;lab.rain.rate=400;lab.wind=4;lab.windTurbulence=2;lab.rain.douse();for(let i=0;i<15;i++)lab.wetting.addLens(.8);await steps(150);result.textContent=JSON.stringify(summary(),null,2);}catch(e){result.textContent='FAIL '+e.stack;}};
document.querySelector('#underwater').onclick=()=>{try{station('ocean');lab.sunlight=2;lab.ambient=.1;lab.wind=0;camera.position.set(0,.7,0);camera.lookAt(0,.8,-4);lab.detail.reset();for(let i=0;i<600;i++){const id=i*4,z=-.3-(i%30)*.13,x=(Math.floor(i/30)%10-4.5)*.13,y=.45+Math.floor(i/300)*.5;lab.detail.fallback[0].image.data.set([x,y,z,.2],id);lab.detail.fallback[1].image.data.set([0,0,0,3],id);lab.detail.fallback[2].image.data.set([.009,2,.6,100],id);}for(const t of lab.detail.fallback)t.needsUpdate=true;lab.detail.bind(lab.detail.fallback);lab.detail.count=600;lab.revision++;draw();const path=read(visual.detailRenderer.paths),tau=read(visual.detailRenderer.paths,1);const near=[],far=[];for(let i=0;i<600;i++){if(i%30<5)near.push(tau[i*4+1]);if(i%30>24)far.push(tau[i*4+1]);}const mean=a=>a.reduce((s,v)=>s+v,0)/a.length,nearTau=mean(near),farTau=mean(far);result.textContent=JSON.stringify({pass:farTau>nearTau*2&&nearTau>0,nearTau,farTau,nearTransmission:Math.exp(-nearTau),farTransmission:Math.exp(-farTau)},null,2);}catch(e){result.textContent='FAIL '+e.stack;}};
document.querySelector('#waterfall').onclick=async()=>{try{station('waterfall');lab.wind=12;lab.windTurbulence=2;await steps(80);result.textContent=JSON.stringify(summary(),null,2);}catch(e){result.textContent='FAIL '+e.stack;}};
document.querySelector('#player').onclick=async()=>{try{station('pool');lab.jets=0;const initial=lab.volume;for(let i=0;i<80;i++){lab.setPlayer([Math.sin(i*.05)*1.5,2.1,0],[Math.cos(i*.05)*4,0,0]);lab.step(lab.timestep);if(i%8===0)await new Promise(r=>setTimeout(r,0));}draw();let min=Infinity;for(let i=0;i<lab.count;i++)min=Math.min(min,lab.playerDistance(Array.from(lab.positions.subarray(i*4,i*4+3))));result.textContent=JSON.stringify({...summary(),clearance:min,pass:min>lab.spacing*.4&&initial===lab.volume&&lab.detail.emitted>0},null,2);}catch(e){result.textContent='FAIL '+e.stack;}};
document.querySelector('#rain').onclick=async()=>{try{station('tank');lab.detail.density=.2;lab.rain.enabled=true;lab.rain.rate=12000;await steps(240);const s=summary(),maxY=Math.max(...lab.positions.filter((_,i)=>i%4===1));result.textContent=JSON.stringify({...s,maxY,pass:s.finite&&Math.abs(s.massDrift)<1e-7&&s.peakSpeed<25&&maxY<6},null,2);}catch(e){result.textContent='FAIL '+e.stack;}};
document.querySelector('#run').onclick=()=>running=!running;document.querySelector('#wipe').onclick=()=>{lab.wetting.lens=[];draw();};
function frame(){if(running){try{lab.step(lab.timestep);draw();result.textContent=JSON.stringify(summary(),null,2);}catch(e){running=false;result.textContent='FAIL '+e.stack;}}requestAnimationFrame(frame);}station('pane');requestAnimationFrame(frame);
</script></body></html>
