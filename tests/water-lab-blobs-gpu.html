<!doctype html><html><body><button id="run">Check liquid size variation</button><pre id="result">Ready</pre><script type="module">
import * as THREE from 'three';
import {WaterLab} from '../src/water-lab.js';
import {WaterLabRenderer} from '../src/water-lab-renderer.js';
import {LabBlobRenderer} from '../src/water-lab-blob-renderer.js';
import {MotionDetail} from '../src/lod.js';
import {QUAD_VERTEX,TONEMAP_FRAGMENT} from '../src/shaders.js';
const renderer=new THREE.WebGLRenderer();renderer.autoClear=false;renderer.setSize(640,480);document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(43,640/480,.01,200),lab=new WaterLab(renderer),target=new THREE.WebGLRenderTarget(640,480,{type:THREE.FloatType}),output=new THREE.Scene();
output.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({glslVersion:THREE.GLSL3,vertexShader:QUAD_VERTEX,fragmentShader:TONEMAP_FRAGMENT,uniforms:{uImage:{value:target.texture}},depthTest:false,depthWrite:false})));
const field={renderer,camera,target,output,quadCamera:new THREE.Camera(),resolution:new THREE.Vector2(640,480),motion:new MotionDetail(),minPixelSigma:2,uniforms:{uView:{value:0},uSHDegree:{value:3}},water:{uniforms:{uWaterRoughness:{value:.07},uTurbidity:{value:.02}}}};
for(const k of ['beach','grass','grains','soft','optics','lightTest'])field[k]={count:0};
const visual=new WaterLabRenderer(field,lab),result=document.querySelector('#result');
renderer.debug.onShaderError=(_gl,_program,_vs,fs)=>{throw new Error(renderer.getContext().getShaderInfoLog(fs));};
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
  result.textContent='Checking GPU Gaussian density…';
  const reference=await LabBlobRenderer.verify(renderer);
  lab.configure('pipe');lab.positions=new Float32Array(9*4);lab.velocities=new Float32Array(9*4);lab.chem=new Float32Array(9*4);lab.neighborCounts=new Uint16Array(9);
  for(let i=0;i<9;i++)lab.positions.set([(i%3-1)*.9,1.2+Math.floor(i/3)*.9,0],i*4);
  camera.position.set(0,2.1,5.5);camera.lookAt(0,2.1,0);camera.updateMatrixWorld();
  const images=[],timings=[];
  for(const refined of [false,true]){
    if(refined)for(let i=0;i<50;i++){lab.time+=.02;visual.blobRenderer.families.update(lab);}
    lab.revision++;visual.render({adaptive:false});renderer.getContext().finish();
    const start=performance.now();visual.render({adaptive:false});renderer.getContext().finish();timings.push(performance.now()-start);
    const pixels=new Float32Array(640*480*4);renderer.readRenderTargetPixels(visual.resolvedWater,0,0,640,480,pixels);images.push(pixels);
    const label=document.createElement('p');label.textContent=refined?'Varied smaller liquid lobes':'Original uniform minimum';document.body.append(label);
    const img=document.createElement('img');img.src=renderer.domElement.toDataURL();img.width=640;document.body.append(img);
  }
  const coverage=images.map(data=>{let count=0;for(let i=3;i<data.length;i+=4)if(data[i]<100)count++;return count;});
  const families=visual.blobRenderer.families.families,volume=families.reduce((v,f)=>v+f.kernels.reduce((s,k)=>s+k.volume,0),0);
  const inventoryError=Math.abs(volume-lab.count*lab.spacing**3);
  const finite=images.every(data=>data.every(Number.isFinite));
  result.textContent=JSON.stringify({reference,finite,coverage,timings,inventoryError,families:families.length,pass:reference.pass&&finite&&coverage[1]>500&&inventoryError<1e-12},null,2);
}catch(e){result.textContent=e.stack;}};
</script></body></html>
