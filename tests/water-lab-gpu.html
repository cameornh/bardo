<!doctype html><html><body><button id="run">Validate water laboratory GPU</button><pre id="result">Ready</pre><script type="module">
import * as THREE from 'three';import {WaterLab} from '../src/water-lab.js';import {LAB_PRESETS} from '../src/water-lab-model.js';import {ParcelFieldGPU} from '../src/parcel-field-gpu.js';
const renderer=new THREE.WebGLRenderer(),lab=new WaterLab(renderer);renderer.setSize(300,200);document.body.append(renderer.domElement);document.querySelector('#run').onclick=async()=>{try{const density=lab.verify(),field=await ParcelFieldGPU.verify(renderer),cases=[];document.querySelector('#result').textContent='Running bounded fixtures…';for(const kind of Object.keys(LAB_PRESETS)){lab.configure(kind);if(kind==='tank'||kind==='glass'){lab.motion.targetTilt=1.6;lab.motion.targetSpin=2;lab.motion.velocity[0]=1;}const before=lab.volume;for(let i=0;i<100;i++){lab.step(Math.min(1/60,Math.sqrt(lab.spec.scale)/70));if(i%4===0)await new Promise(r=>setTimeout(r,0));}const finite=lab.positions.every(Number.isFinite),max=Math.max(0,...lab.positions.map(Math.abs)),sedimentError=lab.bedStock.reduce((a,b)=>a+b,0)+lab.suspendedSediment-lab.initialBed;cases.push({kind,finite,max,waterDrift:lab.volume-before,neighbors:lab.gpu.overflow,sedimentError,pass:finite&&max<(kind==='river'?20:10)&&lab.volume===before&&lab.gpu.overflow===0&&Math.abs(sedimentError)<1e-5});document.querySelector('#result').textContent=JSON.stringify({density,field,cases,running:cases.length<Object.keys(LAB_PRESETS).length},null,2);}document.querySelector('#result').textContent=JSON.stringify({density,field,cases,pass:density.pass&&field.pass&&cases.every(c=>c.pass)},null,2);}catch(e){document.querySelector('#result').textContent=e.stack;}};
</script></body></html>
