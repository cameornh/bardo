<!doctype html><html><body style="background:#252a2c;color:white;font:13px monospace;margin:0"><button id="verify">Validate light transport</button><button id="audit">Compare underside lighting</button><button id="under">Undersides</button><button id="whole">Whole fountain</button><button id="bounce">Toggle bounced light</button><button id="stress">Maximum jet flight</button><button id="step">Advance water</button><pre id="result">Ready</pre><script type="module">
import * as THREE from 'three';
import {WaterLab} from '../src/water-lab.js';import {WaterLabRenderer} from '../src/water-lab-renderer.js';import {MotionDetail} from '../src/lod.js';import {QUAD_VERTEX,TONEMAP_FRAGMENT} from '../src/shaders.js';
import {fountainDistance,FOUNTAIN_GEOMETRY_GLSL,fountainNozzles} from '../src/water-lab-fountain.js';import {fountainVisibility,FOUNTAIN_VISIBILITY_GLSL,fountainBounce,FOUNTAIN_BOUNCE_GLSL} from '../src/water-lab-fountain-light.js';import {traceFountainPhoton} from '../src/water-lab-fountain-caustics.js';import {sampleFieldCPU} from '../src/water-lab-medium-shadows.js';
const r=new THREE.WebGLRenderer({preserveDrawingBuffer:true});r.autoClear=false;r.setSize(800,600);document.body.append(r.domElement);r.debug.onShaderError=(gl,p,v,f)=>{throw Error(gl.getShaderInfoLog(f)||gl.getProgramInfoLog(p));};
const lab=new WaterLab(r);lab.configure('fountain');const camera=new THREE.PerspectiveCamera(43,800/600,.01,300),target=new THREE.WebGLRenderTarget(800,600,{type:THREE.FloatType}),output=new THREE.Scene();output.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({glslVersion:THREE.GLSL3,vertexShader:QUAD_VERTEX,fragmentShader:TONEMAP_FRAGMENT,uniforms:{uImage:{value:target.texture}},depthTest:false,depthWrite:false})));
const field={renderer:r,camera,target,output,quadCamera:new THREE.Camera(),resolution:new THREE.Vector2(800,600),motion:new MotionDetail(),minPixelSigma:2,uniforms:{uView:{value:0},uSHDegree:{value:3}},water:{uniforms:{uWaterRoughness:{value:.07},uTurbidity:{value:.02}}}};for(const k of ['beach','grass','grains','soft','optics','lightTest'])field[k]={count:0};const view=new WaterLabRenderer(field,lab);view.adaptiveResolution=false;const result=document.getElementById('result');const draw=()=>{camera.updateMatrixWorld();view.render({dt:1/30,adaptive:false});};function under(){camera.position.set(4.6,1.10,4);camera.lookAt(0,2.7,0);draw();}under();document.getElementById('under').onclick=under;document.getElementById('whole').onclick=()=>{camera.position.set(11,8.2,14);camera.lookAt(0,3,0);draw();};document.getElementById('bounce').onclick=()=>{lab.fountainCaustics=lab.fountainCaustics===false;lab.revision++;draw();result.textContent='Bounced sunlight '+lab.fountainCaustics;};
document.getElementById('verify').onclick=async()=>{try{draw();const target=new THREE.WebGLRenderTarget(512,1,{type:THREE.FloatType,depthBuffer:false}),s=new THREE.Scene(),material=new THREE.ShaderMaterial({glslVersion:THREE.GLSL3,vertexShader:QUAD_VERTEX,fragmentShader:`precision highp float;out vec4 color;${FOUNTAIN_GEOMETRY_GLSL}${FOUNTAIN_VISIBILITY_GLSL}${FOUNTAIN_BOUNCE_GLSL}void main(){float i=floor(gl_FragCoord.x);vec3 p=vec3(mod(i*17.,97.)/97.*12.-6.,.025,mod(i*13.,83.)/83.*12.-6.),d=normalize(vec3(-.4,1,.3));float c=(i+.5)/512.;vec3 ray=vec3(sqrt(1.-c*c),-c,0);color=vec4(fountainVisibility(p,d),fountainFresnel(c),refract(ray,vec3(0,1,0),1./1.333).y,1);}`,depthTest:false,depthWrite:false});s.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),material));r.setRenderTarget(target);r.render(s,new THREE.Camera());const data=new Float32Array(512*4);r.readRenderTargetPixels(target,0,0,512,1,data);let visibilityError=0,bounceError=0;const sun=[-.4,1,.3].map(x=>x/Math.sqrt(1.25));for(let i=0;i<512;i++){visibilityError=Math.max(visibilityError,Math.abs(data[i*4]-fountainVisibility([(i*17%97)/97*12-6,.025,(i*13%83)/83*12-6],sun)));const c=(i+.5)/512,b=fountainBounce([Math.sqrt(1-c*c),-c,0],[0,1,0]);bounceError=Math.max(bounceError,Math.abs(data[i*4+1]-b.reflection),Math.abs(data[i*4+2]-b.refracted[1]));}
 const photons=view.fountainCaustics.photons,hit=new Float32Array(256*128*4),flux=hit.slice();r.readRenderTargetPixels(photons,0,0,256,128,hit,0,0);r.readRenderTargetPixels(photons,0,0,256,128,flux,0,1);let reflected=0,undersides=0,transmitted=0;for(let i=0;i<256*128;i++){if(hit[i*4+3]<.5)continue;if(i%256<128){reflected++;const p=Array.from(hit.subarray(i*4,i*4+3));if(fountainDistance([p[0],p[1]+.01,p[2]])<fountainDistance([p[0],p[1]-.01,p[2]]))undersides++;}else transmitted++;}
 const l=view.density.layout,atlas=new Float32Array(l.width*l.height*4);r.readRenderTargetPixels(view.density.target,0,0,l.width,l.height,atlas);let hitError=0,fluxError=0,matched=0;for(let y=2;y<128;y+=13)for(let x=2;x<128;x+=11){const d=sun.map(x=>-x),o=[((x+.5)/128-.5)*12,11,((y+.5)/128-.5)*12];o[0]-=d[0]/(-d[1])*11;o[2]-=d[2]/(-d[1])*11;const reference=traceFountainPhoton(o,d,{sample:p=>sampleFieldCPU(atlas,l,p),spacing:lab.spacing,scale:lab.spec.scale,turbidity:.02});for(const [j,p]of reference.entries()){const off=(y*256+x+p.branch*128)*4;if(hit[off+3]<.5)continue;matched++;for(let k=0;k<3;k++){hitError=Math.max(hitError,Math.abs(p.position[k]-hit[off+k]));fluxError=Math.max(fluxError,Math.abs(p.flux[k]-flux[off+k]));}}}
 r.setRenderTarget(null);draw();result.textContent=JSON.stringify({backend:'GPU',visibilityError,bounceError,reflected,undersides,transmitted,matched,hitError,fluxError,pass:visibilityError<.01&&bounceError<1e-5&&undersides>10&&matched>10&&hitError<.06&&fluxError<.03},null,2);
}catch(e){result.textContent=e.stack;}};
document.getElementById('stress').onclick=()=>{try{Object.assign(lab.fountain,{crown:24,arcs:24,lower:24});lab.configure('fountain');const n=fountainNozzles(lab.fountain,lab.spec.scale),g=9.81/lab.spec.scale;let i=0;for(const jet of n)for(let t=0;t<4&&i<lab.count;t+=.08){const o=i++*4,p=jet.point.map((v,k)=>v+jet.direction[k]*jet.speed*t-(k===1?.5*g*t*t:0));if(p[1]<.1)break;lab.positions.set(p,o);lab.velocities.set(jet.direction.map((v,k)=>v*jet.speed-(k===1?g*t:0)),o);}lab.revision++;camera.position.set(40,32,60);camera.lookAt(0,23,0);draw();const image=new Float32Array(800*600*4);r.readRenderTargetPixels(view.blobs,0,0,800,600,image);let highPixels=0,maxRenderedY=0;const ray=new THREE.Vector3();for(let y=0;y<600;y++)for(let x=0;x<800;x++){const t=image[(y*800+x)*4+3];if(t<=0||t>500)continue;ray.set((x+.5)/800*2-1,(y+.5)/600*2-1,.5).unproject(camera).sub(camera.position).normalize();const hitY=camera.position.y+ray.y*t;if(hitY>10)highPixels++;maxRenderedY=Math.max(maxRenderedY,hitY);}result.textContent=JSON.stringify({highPixels,maxRenderedY,maxCrownSpeedMetres:n[0].speed*lab.spec.scale,highestParcel:Math.max(...Array.from({length:lab.count},(_,i)=>lab.positions[i*4+1])),visibleFlightParcels:view.flightRenderer.geometry.instanceCount,timestep:lab.timestep,pass:highPixels>10&&maxRenderedY>30},null,2);}catch(e){result.textContent=e.stack;}};
document.getElementById('audit').onclick=()=>{try{camera.position.set(-4.6,1.1,4);camera.lookAt(0,2.7,0);const size=800*600*4,a=new Float32Array(size),b=a.slice();lab.fountainCaustics=false;lab.revision++;draw();r.readRenderTargetPixels(view.background,0,0,800,600,a);lab.fountainCaustics=true;lab.revision++;draw();r.readRenderTargetPixels(view.background,0,0,800,600,b);const normals=new Float32Array(size);r.readRenderTargetPixels(view.fountainCaustics.receiver,0,0,800,600,normals,0,1);let changed=0,undersideChanged=0,maxGain=0,sum=0;for(let i=0;i<size;i+=4){const d=(b[i]+b[i+1]+b[i+2]-a[i]-a[i+1]-a[i+2])/3;if(d>.002){changed++;if(normals[i+1]<-.3)undersideChanged++;}maxGain=Math.max(maxGain,d);sum+=d;}const originalSun=lab.sunlight,originalRoughness=lab.fountain.roughness;lab.sunlight=0;lab.fountainCaustics=false;lab.revision++;draw();const dark=new Float32Array(size),darkOn=dark.slice();r.readRenderTargetPixels(view.background,0,0,800,600,dark);lab.fountainCaustics=true;lab.revision++;draw();r.readRenderTargetPixels(view.background,0,0,800,600,darkOn);let sunOffError=0;for(let i=0;i<size;i++)sunOffError=Math.max(sunOffError,Math.abs(darkOn[i]-dark[i]));lab.sunlight=originalSun;lab.fountain.roughness=.65;lab.revision++;draw();const roughOn=new Float32Array(size),roughOff=roughOn.slice();r.readRenderTargetPixels(view.background,0,0,800,600,roughOn);lab.fountainCaustics=false;lab.revision++;draw();r.readRenderTargetPixels(view.background,0,0,800,600,roughOff);let materialResponse=0;for(let i=0;i<size;i+=4)materialResponse+=Math.abs(roughOn[i]-roughOff[i]-b[i]+a[i]);lab.fountain.roughness=originalRoughness;lab.fountainCaustics=true;lab.revision++;draw();result.textContent=JSON.stringify({changedPixels:changed,undersideChanged,maxGain,meanGain:sum/(800*600),sunOffError,materialResponse,pass:undersideChanged>100&&maxGain>.01&&sunOffError<1e-6&&materialResponse>1},null,2);}catch(e){result.textContent=e.stack;}};
document.getElementById('step').onclick=async()=>{try{lab.detail.enabled=false;for(let i=0;i<60;i++){lab.step(lab.timestep,true);if(i%10===0)await new Promise(requestAnimationFrame);}draw();result.textContent='Advanced '+lab.time.toFixed(2)+'s · finite '+lab.positions.every(Number.isFinite);}catch(e){result.textContent=e.stack;}};
</script></body></html>
