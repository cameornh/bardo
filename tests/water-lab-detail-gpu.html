<!doctype html><html><body><button id="run">Validate fine water GPU</button><pre id="result">Ready</pre><script type="module">
import * as THREE from 'three';import {LabDetail} from '../src/water-lab-detail.js';import {LabWaterField} from '../src/water-lab-field.js';import {WaterLab} from '../src/water-lab.js';
const renderer=new THREE.WebGLRenderer();renderer.autoClear=false;renderer.setSize(200,150);document.body.append(renderer.domElement);
document.querySelector('#run').onclick=async()=>{try{document.querySelector('#result').textContent='Checking atlas and GPU advection…';const detail=await LabDetail.verify(renderer),field=await LabWaterField.verify(renderer),lab=new WaterLab(renderer),cases=[];for(const [kind,multiplier] of [['glass',.1],['glass',10],['waterfall',1],['ocean',10],['pool',3]]){lab.particleBudget=kind==='pool'?32768:8192;lab.configure(kind,multiplier);const before=lab.volume;for(let i=0;i<75;i++){lab.step(lab.timestep);if(i%3===0)await new Promise(r=>setTimeout(r,0));}cases.push({kind,multiplier,scale:lab.spec.scale,particles:lab.count,spacing:lab.spacing,finite:lab.positions.every(Number.isFinite),volumeDrift:lab.volume-before,fine:lab.detail.count,emitted:lab.detail.emitted,overflows:lab.gpu.overflow});document.querySelector('#result').textContent=JSON.stringify({detail,field,cases},null,2);}const pass=detail.pass&&field.pass&&cases.every(c=>c.finite&&c.volumeDrift===0&&c.overflows===0);document.querySelector('#result').textContent=JSON.stringify({detail,field,cases,pass},null,2);}catch(e){document.querySelector('#result').textContent=e.stack;}};
</script></body></html>
