<!doctype html><html><body><button id="run">Benchmark water frame</button><pre id="result">Ready</pre><script type="module">
import * as THREE from 'three';import {WaterLab} from '../src/water-lab.js';import {WaterLabRenderer} from '../src/water-lab-renderer.js';import {MotionDetail} from '../src/lod.js';import {QUAD_VERTEX,TONEMAP_FRAGMENT} from '../src/shaders.js';
const renderer=new THREE.WebGLRenderer();renderer.autoClear=false;renderer.setSize(480,450);document.body.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(43,480/450,.01,200),lab=new WaterLab(renderer),target=new THREE.WebGLRenderTarget(480,450,{type:THREE.FloatType}),output=new THREE.Scene();output.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({glslVersion:THREE.GLSL3,vertexShader:QUAD_VERTEX,fragmentShader:TONEMAP_FRAGMENT,uniforms:{uImage:{value:target.texture}},depthTest:false,depthWrite:false})));
const field={renderer,camera,target,output,quadCamera:new THREE.Camera(),resolution:new THREE.Vector2(480,450),motion:new MotionDetail(),minPixelSigma:2,uniforms:{uView:{value:0},uSHDegree:{value:3}},water:{uniforms:{uWaterRoughness:{value:.07},uTurbidity:{value:.02}}}};for(const k of ['beach','grass','grains','soft','optics','lightTest'])field[k]={count:0};const visual=new WaterLabRenderer(field,lab);
document.querySelector('#run').textContent='Compare whitewater on / off';
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;document.querySelector('#result').textContent='Simulating waterfall…';try{
 lab.configure('waterfall');camera.position.fromArray(lab.spec.eye);camera.lookAt(new THREE.Vector3(...lab.spec.target));camera.updateMatrixWorld();
 const generation=[];for(let i=0;i<120;i++){lab.step(lab.timestep,true);if(i===29||i===119){const zones=Array.from({length:3},()=>({parcels:0,eligible:0,strength:0}));for(let j=0;j<lab.count;j++){const o=j*4,z=zones[lab.positions[o+1]>4?0:lab.positions[o+1]>.9?1:2];z.parcels++;if(lab.surfaceMetrics[o+3]>.12)z.eligible++;z.strength+=lab.detail.strength[j]||0;}generation.push({step:i+1,zones});}lab.detail.advance(lab.timestep,lab);if(i%3===0){document.querySelector('#result').textContent='Simulating waterfall '+i+'/120';await new Promise(r=>setTimeout(r,0));}}
 const state=[];for(let channel=0;channel<3;channel++){const a=new Float32Array(lab.detail.capacity*4);await renderer.readRenderTargetPixelsAsync(lab.detail.targets[1-lab.detail.current],0,0,256,lab.detail.capacity/256,a,0,channel);state.push(a);}let alive=0,radius=0;for(let i=0;i<lab.detail.capacity;i++){if(state[0][i*4+3]<state[1][i*4+3]){alive++;radius+=state[2][i*4];}}
 const pixels=[];for(const enabled of [false,true]){lab.detail.enabled=enabled;visual.render({dt:1/60,adaptive:false});renderer.getContext().finish();const data=new Float32Array(480*450*4);renderer.readRenderTargetPixels(target,0,0,480,450,data);pixels.push(data);const img=document.createElement('img');img.src=renderer.domElement.toDataURL();img.alt=enabled?'Fine spray on':'Fine spray off';img.width=480;document.body.append(img);}
 let sum=0,max=0,changed=0;for(let i=0;i<pixels[0].length;i+=4){const d=(Math.abs(pixels[0][i]-pixels[1][i])+Math.abs(pixels[0][i+1]-pixels[1][i+1])+Math.abs(pixels[0][i+2]-pixels[1][i+2]))/3;sum+=d;max=Math.max(max,d);if(d>.02)changed++;}
 document.querySelector('#result').textContent=JSON.stringify({generation,alive,radius:radius/Math.max(1,alive),fine:lab.detail.count,meanDifference:sum/(480*450),maxDifference:max,changedPixels:changed,pass:changed>2000},null,2);
 }catch(e){document.querySelector('#result').textContent=e.stack;}};
</script></body></html>
