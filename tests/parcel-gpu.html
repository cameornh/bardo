<!doctype html><html><body><button id="run">Run parcel GPU comparison</button><pre id="result">Ready</pre><script type="module">
import * as THREE from 'three';
import {ParcelFieldGPU} from '../src/parcel-field-gpu.js';
import {PARCEL_FIELD_GLSL,parcelDensity,PARCEL_DX} from '../src/parcel-field.js';
import {QUAD_VERTEX} from '../src/shaders.js';
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.autoClear=false;renderer.setSize(256,256);document.body.append(renderer.domElement);
const field=new ParcelFieldGPU(renderer),items=[];for(let z=-2;z<=2;z++)for(let y=-2;y<=2;y++)for(let x=-2;x<=2;x++)items.push({kind:'sand',position:[x*.21-3.5,y*.21+2.8,z*.21+3.],radius:.13,volume:4*Math.PI/3*.13**3,wet:.2});
const target=new THREE.WebGLRenderTarget(128,128,{type:THREE.FloatType,depthBuffer:false}),scene=new THREE.Scene(),camera=new THREE.Camera();scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({glslVersion:THREE.GLSL3,vertexShader:QUAD_VERTEX,fragmentShader:`precision highp float;precision highp int;in vec2 vUv;out vec4 outColor;${PARCEL_FIELD_GLSL}\nvoid main(){vec3 p=vec3(-4.3+vUv.x*1.6,2.+vUv.y*1.6,3.45);float e=PARCEL_DX*.8;vec3 n=vec3(parcelSample(p+vec3(e,0,0)).r-parcelSample(p-vec3(e,0,0)).r,parcelSample(p+vec3(0,e,0)).r-parcelSample(p-vec3(0,e,0)).r,parcelSample(p+vec3(0,0,e)).r-parcelSample(p-vec3(0,0,e)).r);outColor=vec4(parcelSample(p).r,n/(2.*e));}`,uniforms:field.u,depthTest:false,depthWrite:false})));
document.querySelector('#run').onclick=async()=>{try{field.update([items[0]]);field.update(items);renderer.setRenderTarget(target);renderer.render(scene,camera);const data=await renderer.readRenderTargetPixelsAsync(target,0,0,128,128,new Float32Array(128*128*4));let error=0,gradientError=0;for(let y=0;y<128;y++)for(let x=0;x<128;x++){const p=[-4.3+(x+.5)/128*1.6,2.+(y+.5)/128*1.6,3.45],cpu=parcelDensity(items,p,'sand'),i=(y*128+x)*4;error=Math.max(error,Math.abs(cpu.density-data[i]));for(let k=0;k<3;k++)gradientError=Math.max(gradientError,Math.abs(cpu.gradient[k]-data[i+1+k]));}document.querySelector('#result').textContent=JSON.stringify({voxel:await ParcelFieldGPU.verify(renderer),interpolatedDensityError:error,gradientError,pass:error<.035&&gradientError<.3},null,2);}catch(e){document.querySelector('#result').textContent=e.stack;}};
</script></body></html>
