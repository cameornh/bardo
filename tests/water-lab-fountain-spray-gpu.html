<!doctype html><html><body style="background:#252a2c;color:white;font:13px monospace;margin:0"><button id="verify">Validate high spray GPU / CPU</button><button id="flight">Generate full-height jet spray</button><button id="live">Run live maximum jet</button><button id="whole">Whole jet</button><button id="crest">Jet crest</button><button id="mist">Toggle mist</button><pre id="result">Ready</pre><script type="module">
import * as THREE from 'three';
import {WaterLab} from '../src/water-lab.js';import {WaterLabRenderer} from '../src/water-lab-renderer.js';import {MotionDetail} from '../src/lod.js';import {QUAD_VERTEX,TONEMAP_FRAGMENT} from '../src/shaders.js';
import {fountainNozzles} from '../src/water-lab-fountain.js';
import {LabDetail} from '../src/water-lab-detail.js';
import {FountainDetail,jetBreakupStep} from '../src/water-lab-fountain-spray.js';
const r=new THREE.WebGLRenderer({preserveDrawingBuffer:true});r.autoClear=false;r.setSize(800,600);document.body.append(r.domElement);r.debug.onShaderError=(gl,p,v,f)=>{throw Error(gl.getShaderInfoLog(f)||gl.getProgramInfoLog(p));};
const lab=new WaterLab(r);lab.configure('fountain');const camera=new THREE.PerspectiveCamera(43,800/600,.01,300),target=new THREE.WebGLRenderTarget(800,600,{type:THREE.FloatType}),output=new THREE.Scene();output.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({glslVersion:THREE.GLSL3,vertexShader:QUAD_VERTEX,fragmentShader:TONEMAP_FRAGMENT,uniforms:{uImage:{value:target.texture}},depthTest:false,depthWrite:false})));
const field={renderer:r,camera,target,output,quadCamera:new THREE.Camera(),resolution:new THREE.Vector2(800,600),motion:new MotionDetail(),minPixelSigma:2,uniforms:{uView:{value:0},uSHDegree:{value:3}},water:{uniforms:{uWaterRoughness:{value:.07},uTurbidity:{value:.02}}}};for(const k of ['beach','grass','grains','soft','optics','lightTest'])field[k]={count:0};const view=new WaterLabRenderer(field,lab);view.adaptiveResolution=false;lab.fountainCaustics=false;
const result=document.getElementById('result');function draw(){camera.updateMatrixWorld();view.render({dt:1/30,adaptive:false});}function crest(){let top=0;for(let i=0;i<lab.count;i++)top=Math.max(top,lab.positions[i*4+1]);camera.position.set(3,top-2,7);camera.lookAt(0,top-1,0);draw();}function whole(){camera.position.set(30,30,78);camera.lookAt(0,29,0);draw();}document.getElementById('whole').onclick=whole;document.getElementById('crest').onclick=crest;document.getElementById('mist').onclick=()=>{view.detailRenderer.material.uniforms.uHideMist.value=!view.detailRenderer.material.uniforms.uHideMist.value;draw();};whole();
document.getElementById('verify').onclick=async()=>{try{
 const cpu=new FountainDetail(r,1024),gpu=new FountainDetail(r,1024);cpu.cpu=true;
 lab.wind=12;lab.windTurbulence=1;lab.positions=new Float32Array(0);lab.velocities=new Float32Array(0);lab.chem=new Float32Array(0);lab.time=2;lab.air.update(lab);
 for(const d of [cpu,gpu])for(let i=0;i<128;i++)d.addMarker([Math.sin(i)*.2,15+i*.3,Math.cos(i)*.2],[.2,2,.1],i%2===0?3:0,.006,8,.5);
 for(let i=0;i<24;i++){lab.time+=.01;cpu.advance(.01,lab);gpu.advance(.01,lab);}
 const data=new Float32Array(4096);let error=0;for(let k=0;k<3;k++){r.readRenderTargetPixels(gpu.targets[1-gpu.current],0,0,256,4,data,0,k);for(let i=0;i<128*4;i++)error=Math.max(error,Math.abs(data[i]-cpu.fallback[k].image.data[i]));}
 const prior=await LabDetail.verify(r);result.textContent=JSON.stringify({backend:gpu.cpu?'CPU':'GPU',highSprayMotionError:error,priorStationMotion:prior,pass:!gpu.cpu&&error<.0001&&prior.pass},null,2);cpu.dispose();gpu.dispose();
}catch(e){result.textContent=e.stack;}};
document.getElementById('flight').onclick=async()=>{try{
 Object.assign(lab.fountain,{crown:24,arcs:0,lower:0});lab.configure('fountain');lab.fountainCaustics=false;lab.wind=0;lab.wetting.enabled=false;
 const nozzle=fountainNozzles(lab.fountain,lab.spec.scale)[0],g=9.81/lab.spec.scale,apex=nozzle.speed/g,dt=.02,items=[],states=[];
 // Full flight coverage fixture. Histories are integrated along each ballistic
 // trajectory, not assigned by height. This is not a steady-state solver run.
 for(let t=.04;t<apex*1.98;t+=.022)for(let c=0;c<5;c++){
  const theta=c*Math.PI*2/5,spread=.045+.06*t,px=Math.cos(theta)*spread,pz=Math.sin(theta)*spread;
  items.push({p:[px,5.88+nozzle.speed*t-.5*g*t*t,pz],v:[Math.cos(theta)*.06,nozzle.speed-g*t,Math.sin(theta)*.06]});
  let state={load:nozzle.aeration,damage:0};for(let a=0;a<t;a+=dt)state=jetBreakupStep(state,{spacing:lab.spacing,scale:lab.spec.scale,speed:Math.abs(nozzle.speed-g*a)*lab.spec.scale,deformation:0,breakup:0,neighbors:4,previousNeighbors:4,exposure:1},Math.min(dt,t-a));states.push(state);
 }
 lab.positions=new Float32Array(items.length*4);lab.velocities=lab.positions.slice();lab.chem=lab.positions.slice();lab.neighborCounts=new Uint16Array(items.length).fill(4);lab.surfaceMetrics=lab.positions.slice();lab.aerationActivity=new Float32Array(items.length*2);lab.surfaceBreakup=new Float32Array(items.length);
 items.forEach((q,i)=>{lab.positions.set(q.p,i*4);lab.velocities.set(q.v,i*4);lab.detail.launch(i,nozzle);Object.assign(lab.detail.jetStates[i],states[i],{neighbors:4});});lab.detail.jetPrimed=true;
 for(let k=0;k<50;k++){lab.time+=.02;lab.detail.emit(lab,.02);lab.detail.advance(.02,lab);if(k%8===0){result.textContent='Advecting high spray '+k+'/50';await new Promise(requestAnimationFrame);}}
 lab.revision++;crest();const d=lab.detail,a=new Float32Array(d.capacity*4),v=a.slice(),info=a.slice(),target=d.targets[1-d.current];r.readRenderTargetPixels(target,0,0,256,d.capacity/256,a,0,0);r.readRenderTargetPixels(target,0,0,256,d.capacity/256,v,0,1);r.readRenderTargetPixels(target,0,0,256,d.capacity/256,info,0,2);let highest=-Infinity,highSpray=0,highMist=0;for(let i=0;i<d.capacity;i++){const o=i*4;if(v[o+3]>a[o+3]){highest=Math.max(highest,a[o+1]);if(a[o+1]>45){if(info[o+1]>2.5)highMist++;else highSpray++;}}}
 const pixels=new Uint16Array(800*600*4);r.readRenderTargetPixels(view.detailRenderer.target,0,0,800,600,pixels);let density=0,visible=0;for(let i=3;i<pixels.length;i+=4){const alpha=THREE.DataUtils.fromHalfFloat(pixels[i]);density+=alpha;if(alpha>.015)visible++;}
 result.textContent=JSON.stringify({highest,highSpray,highMist,sprayEmitted:d.jetSprayEmitted,mistEmitted:d.jetMistEmitted,visibleCrestPixels:visible,crestOpticalDensity:density,pass:highest>50&&highSpray>100&&highMist>100&&visible>100},null,2);
}catch(e){result.textContent=e.stack;}};
document.getElementById('live').onclick=async()=>{try{Object.assign(lab.fountain,{crown:24,arcs:0,lower:0});lab.configure('fountain');lab.fountainCaustics=false;lab.wetting.enabled=false;const volume=lab.volume,start=performance.now(),dt=lab.timestep;for(let i=0;i<1240;i++){lab.step(dt,true);if(i%8===7){lab.detail.advance(dt*8,lab);result.textContent='Live maximum jet: '+lab.time.toFixed(2)+' / 4.74 s';await new Promise(requestAnimationFrame);}}lab.revision++;crest();let highest=0;for(let i=0;i<lab.count;i++)highest=Math.max(highest,lab.positions[i*4+1]);const d=lab.detail,a=new Float32Array(d.capacity*4),v=a.slice(),info=a.slice(),target=d.targets[1-d.current];for(let k=0;k<3;k++)r.readRenderTargetPixels(target,0,0,256,d.capacity/256,[a,v,info][k],0,k);let highSpray=0,highMist=0;for(let i=0;i<d.capacity;i++){const o=i*4;if(v[o+3]>a[o+3]&&a[o+1]>highest-8){if(info[o+1]>2.5)highMist++;else highSpray++;}}result.textContent=JSON.stringify({liveSolver:true,highSpray,highMist,time:lab.time,elapsedMs:performance.now()-start,highest,volumeDrift:lab.volume-volume,sprayEmitted:lab.detail.jetSprayEmitted,mistEmitted:lab.detail.jetMistEmitted,finite:lab.positions.every(Number.isFinite)},null,2);}catch(e){result.textContent=e.stack;}};
</script></body></html>
