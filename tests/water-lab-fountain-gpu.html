<!doctype html><html><body>
<button id="verify">Validate fountain CPU / GPU</button><button id="circulate">Run 180 fountain steps</button><pre id="result">Ready</pre>
<script type="module">
import * as THREE from 'three';
import {WaterLab} from '../src/water-lab.js';
import {fountainDistance,FOUNTAIN_GEOMETRY_GLSL} from '../src/water-lab-fountain.js';
import {solveDensity,fixtureDistance,createMotion,normalAt} from '../src/water-lab-model.js';
import {QUAD_VERTEX} from '../src/shaders.js';
const renderer=new THREE.WebGLRenderer();renderer.setSize(320,180);document.body.append(renderer.domElement);const lab=new WaterLab(renderer),result=document.getElementById('result');renderer.debug.onShaderError=(gl,p,v,f)=>{throw Error(gl.getShaderInfoLog(f)||gl.getProgramInfoLog(p));};lab.configure('fountain');
document.getElementById('verify').onclick=()=>{try{
 const target=new THREE.WebGLRenderTarget(64,64,{type:THREE.FloatType,depthBuffer:false}),material=new THREE.ShaderMaterial({glslVersion:THREE.GLSL3,vertexShader:QUAD_VERTEX,fragmentShader:`precision highp float;out vec4 outColor;${FOUNTAIN_GEOMETRY_GLSL}void main(){float i=floor(gl_FragCoord.x)+64.*floor(gl_FragCoord.y);vec3 p=vec3(mod(i*17.,97.)/97.*10.-5.,mod(i*31.,89.)/89.*7.,mod(i*13.,83.)/83.*10.-5.);if(mod(i,17.)==0.)p.xz=vec2(0);outColor=vec4(fountainDistance(p),0,0,1);}`,depthTest:false,depthWrite:false}),scene=new THREE.Scene(),geometry=new THREE.PlaneGeometry(2,2);scene.add(new THREE.Mesh(geometry,material));renderer.setRenderTarget(target);renderer.render(scene,new THREE.Camera());const read=new Float32Array(64*64*4);renderer.readRenderTargetPixels(target,0,0,64,64,read);renderer.setRenderTarget(null);let geometryError=0;for(let i=0;i<4096;i++)geometryError=Math.max(geometryError,Math.abs(read[i*4]-fountainDistance([i%17===0?0:(i*17%97)/97*10-5,(i*31%89)/89*7,i%17===0?0:(i*13%83)/83*10-5])));material.dispose();geometry.dispose();target.dispose();
 const data=new Float32Array(4*4*4*4);let at=0;for(let z=0;z<4;z++)for(let y=0;y<4;y++)for(let x=0;x<4;x++)data.set([2.35+x*.13,2.26+y*.12,z*.14-.2,at===0?1:0],at++*4);
 const gpu=lab.gpu.solve(data,.21,p=>lab.collide(p),3,p=>lab.solid(p)),cpu=solveDensity(data,lab.gpu.neighbors,.21,3,p=>lab.collide(p),p=>lab.solid(p)).positions;let solverError=0;for(let i=0;i<gpu.length;i++)solverError=Math.max(solverError,Math.abs(gpu[i]-cpu[i]));result.textContent=JSON.stringify({backend:lab.gpu.cpu?'CPU':'GPU',geometryError,solverError,heldError:Math.abs(gpu[0]-data[0]),pass:!lab.gpu.cpu&&geometryError<.0001&&solverError<.002},null,2);
}catch(e){result.textContent=e.stack;}};
document.getElementById('circulate').onclick=async()=>{try{lab.configure('fountain');lab.detail.enabled=false;lab.wetting.enabled=false;const before=lab.volume,start=performance.now();for(let i=0;i<180;i++){lab.step(lab.timestep,true);if(i%6===0){result.textContent='Simulating '+i+'/180';await new Promise(requestAnimationFrame);}}
const distribution=[0,0,0,0];let worst=0,maxY=0;for(let i=0;i<lab.count;i++){const p=Array.from(lab.positions.subarray(i*4,i*4+3));distribution[p[1]<1?0:p[1]<3?1:p[1]<5?2:3]++;worst=Math.min(worst,lab.solid(p));maxY=Math.max(maxY,p[1]);}result.textContent=JSON.stringify({time:lab.time,elapsedMs:performance.now()-start,volumeDrift:lab.volume-before,recycled:lab.fountainRecycled,distribution,worst,maxY,neighbors:lab.gpu.overflow,pass:lab.positions.every(Number.isFinite)&&lab.volume===before&&worst>-.05&&lab.fountainRecycled>100&&distribution.every(n=>n>20)},null,2);
}catch(e){result.textContent=e.stack;}};
</script></body></html>
