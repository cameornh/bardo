<!doctype html><html><body><button id="run">Validate wet whitewater</button><pre id="result">Ready</pre><script type="module">
import * as THREE from 'three';
import {WaterLab} from '../src/water-lab.js';
import {LabDetail} from '../src/water-lab-detail.js';
import {WaterLabRenderer} from '../src/water-lab-renderer.js';
import {MotionDetail} from '../src/lod.js';
import {QUAD_VERTEX,TONEMAP_FRAGMENT} from '../src/shaders.js';
const renderer=new THREE.WebGLRenderer();renderer.autoClear=false;renderer.setSize(480,450);document.body.append(renderer.domElement);
renderer.debug.onShaderError=(_gl,_program,_vs,fs)=>{throw new Error(renderer.getContext().getShaderInfoLog(fs));};
const lab=new WaterLab(renderer),camera=new THREE.PerspectiveCamera(43,480/450,.01,200),target=new THREE.WebGLRenderTarget(480,450,{type:THREE.FloatType}),output=new THREE.Scene();
output.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({glslVersion:THREE.GLSL3,vertexShader:QUAD_VERTEX,fragmentShader:TONEMAP_FRAGMENT,uniforms:{uImage:{value:target.texture}},depthTest:false,depthWrite:false})));
const field={renderer,camera,target,output,quadCamera:new THREE.Camera(),resolution:new THREE.Vector2(480,450),motion:new MotionDetail(),minPixelSigma:2,uniforms:{uView:{value:0},uSHDegree:{value:3}},water:{uniforms:{uWaterRoughness:{value:.07},uTurbidity:{value:.02}}}};
for(const k of ['beach','grass','grains','soft','optics','lightTest'])field[k]={count:0};
const visual=new WaterLabRenderer(field,lab),result=document.querySelector('#result');
function read(detail,channel){const data=new Float32Array(detail.capacity*4);renderer.readRenderTargetPixels(detail.targets[1-detail.current],0,0,256,detail.capacity/256,data,0,channel);return data;}
async function wetReference(){
  lab.configure('tank');lab.spec.spacing=.25;const points=[];
  for(let z=-2;z<=2;z++)for(let y=0;y<4;y++)for(let x=-2;x<=2;x++)points.push(x*.25,.8+y*.25,z*.25,0);
  lab.positions=new Float32Array(points);lab.velocities=new Float32Array(points.length);lab.neighborCounts=new Uint16Array(lab.count).fill(18);
  for(let i=0;i<lab.count;i++)lab.velocities.set([.4,0,.1],i*4);
  const gpu=new LabDetail(renderer,256),cpu=new LabDetail(renderer,256);cpu.cpu=true;
  for(const system of [gpu,cpu]){
    system.pending=4;
    [[0,1.05,0,0],[0,1.83,0,0],[1.8,2.7,0,0],[0,.6,0,0]].forEach((p,i)=>system.spawn[0].image.data.set(p,i*4));
    [[0,0,0,3],[0,0,0,3],[80,0,0,3],[0,-40,0,3]].forEach((v,i)=>system.spawn[1].image.data.set(v,i*4));
    for(let i=0;i<4;i++){system.spawn[2].image.data.set([.004,i<2?i+1:0,.5,0],i*4);system.expiry[i]=3;}
  }
  try{
    for(let i=0;i<12;i++){lab.time+=.01;if(i>2){lab.motion.position[0]-=.035;lab.motion.velocity[0]=-3.5;}lab.syncUniforms();gpu.advance(.01,lab);cpu.advance(.01,lab);}
    let error=0;const data=[0,1,2].map(k=>read(gpu,k));
    for(let k=0;k<3;k++)for(let i=0;i<16;i++)error=Math.max(error,Math.abs(data[k][i]-cpu.fallback[k].image.data[i]));
    const clearances=Array.from({length:4},(_,i)=>lab.solid(Array.from(data[0].subarray(i*4,i*4+3))));
    return {error,clearances,kinds:Array.from({length:4},(_,i)=>data[2][i*4+1]),pass:error<.003&&clearances.every(v=>v>=.0075)};
  }finally{gpu.dispose();cpu.dispose();}
}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
  result.textContent='Comparing GPU/CPU air and wet advection, swept and moving walls…';
  const air=await LabDetail.verify(renderer),wet=await wetReference(),cases=[];
  for(const kind of ['glass','pool','tank','pipe','waterfall','ocean']){
    lab.configure(kind);if(kind==='ocean'){lab.wind=67;lab.sunlight=3;lab.ambient=0;}camera.position.fromArray(lab.spec.eye);camera.lookAt(new THREE.Vector3(...lab.spec.target));camera.updateMatrixWorld();const volume=lab.volume;
    const steps=kind==='ocean'?240:75;for(let i=0;i<steps;i++){
      if(kind==='tank'||kind==='glass'){lab.motion.target[0]=Math.sin(i*.1)*.6;lab.motion.targetTilt=Math.sin(i*.08)*.25;}
      lab.step(lab.timestep);if(i%5===0){result.textContent=JSON.stringify({air,wet,cases,progress:kind+' '+i+'/'+steps},null,2);await new Promise(r=>setTimeout(r,0));}
    }
    visual.render({adaptive:false});const p=read(lab.detail,0),v=read(lab.detail,1),info=read(lab.detail,2),kinds=[0,0,0,0];let penetrations=0;
    for(let i=0;i<lab.detail.capacity;i++)if(p[i*4+3]<v[i*4+3]){kinds[Math.round(info[i*4+1])]++;if(lab.solid(Array.from(p.subarray(i*4,i*4+3)))<-.005)penetrations++;}
    const pixels=new Float32Array(480*450*4);renderer.readRenderTargetPixels(target,0,0,480,450,pixels);
    cases.push({kind,kinds,penetrations,emitted:lab.detail.emitted,breakupEmitted:lab.detail.breakupEmitted,volumeDrift:lab.volume-volume,finite:p.every(Number.isFinite)&&pixels.every(Number.isFinite)});
    const title=document.createElement('p');title.textContent=kind;document.body.append(title);const img=document.createElement('img');img.src=renderer.domElement.toDataURL();img.width=480;document.body.append(img);
  }
  result.textContent=JSON.stringify({air,wet,cases,pass:air.pass&&wet.pass&&cases.every(c=>c.finite&&c.volumeDrift===0&&c.penetrations===0)},null,2);
}catch(e){result.textContent=e.stack;}};
</script></body></html>
