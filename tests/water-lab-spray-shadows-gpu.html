<!doctype html><html><body><button id="run">Validate spray shadows</button><button id="off" disabled>Shadows off</button><button id="on" disabled>Shadows on</button><pre id="result">Ready</pre><script type="module">
import * as THREE from 'three';
import {WaterLab} from '../src/water-lab.js';
import {WaterLabRenderer} from '../src/water-lab-renderer.js';
import {LabSprayShadows,SPRAY_SHADOW_GLSL} from '../src/water-lab-spray-shadows.js';
import {MotionDetail} from '../src/lod.js';
import {QUAD_VERTEX,TONEMAP_FRAGMENT} from '../src/shaders.js';
const renderer=new THREE.WebGLRenderer({preserveDrawingBuffer:true});renderer.autoClear=false;renderer.setSize(640,480);document.body.append(renderer.domElement);
renderer.debug.onShaderError=(gl,program,vs,fs)=>{throw new Error(gl.getShaderInfoLog(fs)||gl.getShaderInfoLog(vs)||gl.getProgramInfoLog(program));};
const lab=new WaterLab(renderer),camera=new THREE.PerspectiveCamera(43,640/480,.01,200),target=new THREE.WebGLRenderTarget(640,480,{type:THREE.FloatType}),output=new THREE.Scene();
output.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({glslVersion:THREE.GLSL3,vertexShader:QUAD_VERTEX,fragmentShader:TONEMAP_FRAGMENT,uniforms:{uImage:{value:target.texture}},depthTest:false,depthWrite:false})));
const field={renderer,camera,target,output,quadCamera:new THREE.Camera(),resolution:new THREE.Vector2(640,480),motion:new MotionDetail(),minPixelSigma:2,uniforms:{uView:{value:0},uSHDegree:{value:3}},water:{uniforms:{uWaterRoughness:{value:.07},uTurbidity:{value:.02}}}};
for(const k of ['beach','grass','grains','soft','optics','lightTest'])field[k]={count:0};
const visual=new WaterLabRenderer(field,lab),result=document.querySelector('#result');
function readTarget(t){const data=new Float32Array(t.width*t.height*4);renderer.readRenderTargetPixels(t,0,0,t.width,t.height,data);return data;}
function draw(enabled){visual.sprayShadows.enabled=enabled;visual.render({adaptive:false});const data=new Float32Array(640*480*4);renderer.readRenderTargetPixels(target,0,0,640,480,data);return data;}
function bind(markers){lab.detail.reset();markers.forEach((item,i)=>item.forEach((values,k)=>lab.detail.fallback[k].image.data.set(values,i*4)));for(const t of lab.detail.fallback)t.needsUpdate=true;lab.detail.count=markers.length;lab.detail.time=.2;lab.detail.bind(lab.detail.fallback);lab.revision++;}
function compareMap(){
 const markers=[[[0,3,0,.2],[2,-3,1,2],[.18,0,.6,1]],[[.15,3.2,0,.3],[-2,1,1,2],[.14,1,.5,1]],[[0,3,0,3],[0,0,0,2],[.4,0,.9,1]],[[1,2,0,.4],[0,0,0,2],[.14,2,.4,1]]];bind(markers);
 const gpu=new LabSprayShadows(renderer,lab,64),cpu=new LabSprayShadows(renderer,lab,64);cpu.cpu=true;gpu.update();cpu.update();let error=0,peak=0;
 for(let layer=0;layer<4;layer++){const raw=new Uint16Array(64*64*4);renderer.readRenderTargetPixels(gpu.target,0,0,64,64,raw,0,layer);const expected=cpu.fallback[layer].image.data;for(let i=0;i<raw.length;i++){const actual=THREE.DataUtils.fromHalfFloat(raw[i]);error=Math.max(error,Math.abs(actual-expected[i]));peak=Math.max(peak,actual);}}
 // Query light above and below the exact same cloud, then disable and reset.
 const g=new THREE.PlaneGeometry(2,2),m=new THREE.ShaderMaterial({glslVersion:THREE.GLSL3,vertexShader:QUAD_VERTEX,fragmentShader:`precision highp float;out vec4 outColor;${SPRAY_SHADOW_GLSL}void main(){float d=gl_FragCoord.x<1.?-3.:3.;outColor=vec4(spraySun(vec3(0,3,0)+uSprayL*d));}`,uniforms:gpu.u,depthTest:false,depthWrite:false}),scene=new THREE.Scene(),rt=new THREE.WebGLRenderTarget(2,1,{type:THREE.FloatType});scene.add(new THREE.Mesh(g,m));
 const read=()=>{renderer.setRenderTarget(rt);renderer.render(scene,new THREE.Camera());const data=new Float32Array(8);renderer.readRenderTargetPixels(rt,0,0,2,1,data);renderer.setRenderTarget(null);return [data[0],data[4]];};
 const transmission=read();lab.detail.enabled=false;gpu.update();const disabled=read();lab.detail.enabled=true;lab.detail.reset();gpu.update();const empty=read();
 for(const r of [gpu,cpu,g,m,rt])r.dispose();return {error,peak,transmission,disabled,empty,pass:peak>.01&&error<.003&&transmission[0]<.96&&transmission[1]>.999&&disabled.every(v=>v===1)&&empty.every(v=>v===1)};
}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
 const reference=compareMap();lab.configure('pool');lab.ambient=1;lab.lights=0;
 const cloud=[];for(let i=0;i<1600;i++){const a=i*2.39996,r=Math.sqrt((i+.5)/1600);cloud.push([[Math.cos(a)*r*1.4,3.5+.25*Math.sin(i*.73),Math.sin(a)*r,.25],[.5,-1,.2,2],[.035,0,.6,1]]);}bind(cloud);
 camera.position.set(7,7,10);camera.lookAt(0,1,0);draw(false);const waterOff=readTarget(visual.water),causticOff=readTarget(visual.caustics);draw(true);const waterOn=readTarget(visual.water),causticOn=readTarget(visual.caustics),solid=readTarget(visual.background);let waterPixels=0,waterPeak=0,causticLoss=0;
 for(let i=0;i<waterOn.length;i+=4)if(waterOn[i+3]<solid[i+3]-.01){const d=waterOff[i]-waterOn[i];if(d>.01)waterPixels++;waterPeak=Math.max(waterPeak,d);}
 for(let i=0;i<causticOn.length;i+=4)causticLoss+=causticOff[i]-causticOn[i];
 const water={changed:waterPixels,peak:waterPeak,causticLoss,pass:waterPixels>100&&waterPeak>.025&&causticLoss>0};
 lab.configure('pipe');lab.positions=new Float32Array(0);lab.velocities=new Float32Array(0);lab.chem=new Float32Array(0);lab.neighborCounts=new Uint16Array(0);
 const markers=[];for(let i=0;i<1000;i++){const a=i*2.39996,r=Math.sqrt((i+.5)/1000),x=Math.cos(a)*r*1.2,z=Math.sin(a)*r*.7;markers.push([[x,2.7+.35*Math.sin(i*.73),z,.25],[.5,-1,.2,2],[.035,0,.6,1]]);}bind(markers);
 camera.position.set(7,7,10);camera.lookAt(0,1,0);const off=draw(false),floorOff=readTarget(visual.background),on=draw(true),floorOn=readTarget(visual.background);let changed=0,peak=0,finite=true;for(let i=0;i<on.length;i+=4){const d=floorOff[i]-floorOn[i];if(d>.025)changed++;peak=Math.max(peak,d);finite&&=Number.isFinite(on[i]);}
 const ground={changed,peak,finite,pass:changed>100&&peak>.08&&finite};
 // Fixed particle positions and light give an invariant opacity map as the camera moves.
 const oldKey=visual.sprayShadows.key;camera.position.set(-7,7,10);camera.lookAt(0,1,0);draw(true);const cameraInvariant=oldKey===visual.sprayShadows.key;
 camera.position.set(7,7,10);camera.lookAt(0,1,0);draw(true);
 result.textContent=JSON.stringify({pass:reference.pass&&ground.pass&&water.pass&&cameraInvariant,reference,ground,water,cameraInvariant},null,2);
 for(const name of ['off','on']){document.querySelector('#'+name).disabled=false;document.querySelector('#'+name).onclick=()=>draw(name==='on');}
}catch(e){result.textContent='FAIL '+e.stack;}};
</script></body></html>
