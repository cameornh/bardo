<!doctype html><html><body><button id="run">Benchmark water frame</button><pre id="result">Ready</pre><script type="module">
import * as THREE from 'three';import {WaterLab} from '../src/water-lab.js';import {LAB_PRESETS} from '../src/water-lab-model.js';import {WaterLabRenderer} from '../src/water-lab-renderer.js';import {MotionDetail} from '../src/lod.js';import {QUAD_VERTEX,TONEMAP_FRAGMENT} from '../src/shaders.js';
const renderer=new THREE.WebGLRenderer();renderer.autoClear=false;renderer.setSize(480,450);document.body.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(43,480/450,.01,200),lab=new WaterLab(renderer),target=new THREE.WebGLRenderTarget(480,450,{type:THREE.HalfFloatType}),output=new THREE.Scene();output.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({glslVersion:THREE.GLSL3,vertexShader:QUAD_VERTEX,fragmentShader:TONEMAP_FRAGMENT,uniforms:{uImage:{value:target.texture}},depthTest:false,depthWrite:false})));
const field={renderer,camera,target,output,quadCamera:new THREE.Camera(),resolution:new THREE.Vector2(480,450),motion:new MotionDetail(),minPixelSigma:2,uniforms:{uView:{value:0},uSHDegree:{value:3}},water:{uniforms:{uWaterRoughness:{value:.07},uTurbidity:{value:.02}}}};for(const k of ['beach','grass','grains','soft','optics','lightTest'])field[k]={count:0};const visual=new WaterLabRenderer(field,lab);
document.querySelector('#run').onclick=async()=>{try{const results=[];for(const kind of ['pool','waterfall','glass']){lab.resolutions[kind]=kind==='waterfall'?2/3:1;lab.configure(kind);camera.position.fromArray(lab.spec.eye);camera.lookAt(new THREE.Vector3(...lab.spec.target));camera.updateMatrixWorld();const samples=[],cpu=[];for(let i=0;i<34;i++){const start=performance.now();for(let k=0;k<3;k++)lab.step(lab.timestep,true);lab.detail.advance(3*lab.timestep,lab,lab.detailJet);const sim=performance.now();visual.render({dt:1/60,adaptive:false});renderer.getContext().finish();if(i>9){samples.push(performance.now()-start);cpu.push(sim-start);}await new Promise(r=>requestAnimationFrame(r));}samples.sort((a,b)=>a-b);results.push({kind,frameMedian:samples[12],frameP95:samples[22],simulationMean:cpu.reduce((a,b)=>a+b,0)/cpu.length,draw:{...visual.timers.ms},particles:lab.count,fine:lab.detail?.count||0,steps:{...lab.timings}});document.querySelector('#result').textContent=JSON.stringify(results,null,2);}}catch(e){document.querySelector('#result').textContent=e.stack;}};
</script></body></html>
