<!doctype html><html><head><title>3D liquid diagnostic</title></head><body><button id="compare">Compare 3D GPU / CPU</button><button id="wind">Run wind / reef test</button><button id="best">Stop / show best overturn</button><pre id="result" style="white-space:pre-wrap;max-width:100%">Ready</pre><canvas id="slice" style="width:100%;max-width:960px" width="960" height="420"></canvas><script type="module">
import * as THREE from 'three';
import {VolumeWaterGPU} from '../src/volume-water-gpu.js';
import {BeachTerrain} from '../src/beach-terrain.js';
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setSize(1,1);renderer.autoClear=false;
const out=document.querySelector('#result'),canvas=document.querySelector('#slice'),context=canvas.getContext('2d');
document.querySelector('#compare').onclick=async()=>{out.textContent='Comparing';try{out.textContent=JSON.stringify({closed:await VolumeWaterGPU.verify(renderer),open:await VolumeWaterGPU.verify(renderer,{open:true})});}catch(e){out.textContent=e.stack;}};
let volume,initialVolume=0,peak=0,best=null,stopped=false;
function draw(){const r=volume.reference,[nx,ny,nz]=r.size,counts=new Map();for(const c of volume.metrics.crests||[])counts.set(c[0],(counts.get(c[0])||0)+1);const x=counts.size?[...counts].sort((a,b)=>b[1]-a[1])[0][0]:Math.floor(nx/2);context.fillStyle='#b0d0dc';context.fillRect(0,0,canvas.width,canvas.height);for(let z=0;z<nz;z++)for(let y=0;y<ny;y++){const i=r.index(x,y,z),a=r.fraction[i*4];context.fillStyle=r.solid[i]<0?'#8b795b':`rgba(20,90,150,${a})`;context.fillRect(z/nz*canvas.width,(ny-1-y)/ny*canvas.height,canvas.width/nz+1,canvas.height/ny+1);}if(volume.metrics.overhangs>peak){peak=volume.metrics.overhangs;best={fraction:r.fraction.slice(),metrics:structuredClone(volume.metrics),time:volume.time};}out.textContent=JSON.stringify({time:volume.time,grid:volume.size,dx:volume.dx,peak,...volume.metrics,volumeDrift:(volume.metrics.volume-initialVolume)/initialVolume,crests:volume.metrics.crests.slice(0,4),error:volume.error},null,2);}
document.querySelector('#wind').onclick=async()=>{try{stopped=false;peak=0;best=null;volume?.dispose();volume=new VolumeWaterGPU(renderer,{size:[12,40,176],dx:.125,origin:[-18.75,-3,-26],terrain:new BeachTerrain(),iterations:64,open:false});initialVolume=volume.metrics.volume;for(let frame=0;frame<360&&!stopped&&volume.enabled;frame++){volume.step(1/60,{wind:20,angle:0,turbulence:1.5,jet:volume.time<2?{origin:[-18,2,-23],direction:[0,-.9,.435889894],radius:1.5,strength:120,length:25}:null});if(frame%15===0){await volume.read();if(!stopped)draw();await new Promise(requestAnimationFrame);}}if(!stopped){await volume.read();draw();}}catch(e){out.textContent=e.stack;}};
document.querySelector('#best').onclick=()=>{stopped=true;if(best){volume.reference.fraction=best.fraction;volume.metrics=best.metrics;volume.time=best.time;draw();}};
</script></body></html>
