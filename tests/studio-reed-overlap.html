<!doctype html><meta charset="utf-8"><title>Reed overlap</title>
<canvas width="192" height="192"></canvas><pre id="result">Checking reed depth and soft edges…</pre>
<script type="module">
import * as T from 'three';
import {WetlandReeds} from '../src/asset-studio/wetland-reeds.js';
import {growCrown} from '../src/asset-studio/wind-garden.js';

function check(){
 const size=192,camera=new T.PerspectiveCamera(38,1,.03,30);
 const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:false,alpha:true});
 renderer.setClearColor(0,0);renderer.setSize(size,size,false);
 const viewport={value:new T.Vector2(size,size)},oceanView={uniforms:{}};
 const reeds=new WetlandReeds({uniforms:{viewport},oceanView},'vec3 env(vec3 n,float r){return vec3(.5);}');
 const target=new T.WebGLRenderTarget(size,size,{depthTexture:new T.DepthTexture(size,size,T.UnsignedIntType)});
 const identity={position:[0,0,0],rotation:[0,0,0],scale:[1,1,1]};
 const materials=['#cc2929','#31b42b','#2b52c5'].map((color,i)=>({id:'dye'+i,color}));
 const land={crowns:()=>[]};
 const bytePath=new URLSearchParams(location.search).has('bytes');
 if(bytePath){
  const has=renderer.extensions.has.bind(renderer.extensions);
  renderer.extensions.has=n=>n==='EXT_color_buffer_float'?false:has(n);
 }
 function asset(dye,at,tilt=0,lean=0){
  const id='cane'+dye,a=growCrown(id,id,10,.9,1),p=a.parts[0],s=p.stamps[0];
  p.id=id;p.marks=[];p.transform.rotation=[tilt,0,lean];p.transform.position=at;
  s.materialId=materials[dye].id;s.size=[.052,.68,.052];s.position=[0,.68,0];
  a.parts=[p];return a;
 }
 function view(sign){
  camera.position.set(0,.68,2.6*sign);camera.lookAt(0,.68,0);camera.updateMatrixWorld();
 }
 function setup(assets,batched){
  const a=batched?[{...assets[0],parts:assets.flatMap(a=>a.parts)}]:assets;
  reeds.configure(a,materials,a.map(v=>({id:v.id,assetId:v.id,transform:identity})));
  reeds.update(land,camera,null,0,{});
 }
 function read(only=null,reverse=false,blocker=null){
  for(const mesh of reeds.group.children){
   mesh.visible=only===null||mesh.userData.variant===only;
   mesh.renderOrder=(reverse?-1:1)*(3*mesh.userData.variant+mesh.userData.lod);
  }
  renderer.setRenderTarget(target);renderer.autoClear=true;renderer.clear();
  if(blocker)renderer.render(blocker,camera);
  renderer.autoClear=false;reeds.draw(renderer,camera,0);
  const bytes=new Uint8Array(size*size*4);renderer.readRenderTargetPixels(target,0,0,size,size,bytes);
  return bytes;
 }
 function assess(name,assets,order,batched=false,blocker=null){
  setup(assets,false);
  const single=assets.map((_,i)=>read(i,false,blocker));
  if(batched)setup(assets,true);
  const combined=read(null,false,blocker);
  if(batched)for(const mesh of reeds.group.children){
   const idx=mesh.geometry.index,src=idx.array.slice();
   for(let i=0;i<src.length;i+=6)idx.array.set(src.subarray(src.length-i-6,src.length-i),i);idx.needsUpdate=true;
  }
  const reverse=read(null,true,blocker);
  let overlap=0,error=0,alphaError=0,orderError=0,sum=0,worst;
  for(let p=0;p<size*size;p++){
   const i=p*4;if(single.some(s=>s[i+3]<15))continue;
   const sorted=order(p);if(!sorted)continue;
   let rgb=[0,0,0],alpha=0;
   for(const j of sorted){
    const a=single[j][i+3]/255;
    rgb=rgb.map((v,k)=>v*(1-a)+single[j][i+k]);alpha=alpha*(1-a)+a;
   }
   overlap++;
   for(let k=0;k<3;k++){
    const diff=Math.abs(combined[i+k]-rgb[k]);if(diff>error)worst={x:p%size,y:Math.floor(p/size),expected:rgb.map(Math.round),actual:[...combined.slice(i,i+4)],isolated:single.map(s=>[...s.slice(i,i+4)])};error=Math.max(error,diff);sum+=diff;
    orderError=Math.max(orderError,Math.abs(combined[i+k]-reverse[i+k]));
   }
   alphaError=Math.max(alphaError,Math.abs(255*alpha-combined[i+3]));
  }
  return {name,overlap,rgbMax:+error.toFixed(2),rgbMean:+(sum/(3*overlap)).toFixed(2),alphaMax:+alphaError.toFixed(2),orderMax:orderError,
   ...(error>4?{worst}:{}),pass:overlap>30&&error<=4&&alphaError<=3&&orderError<=2};
 }
 const cases=[];
 for(const sign of [1,-1]){
  view(sign);
  const assets=[asset(0,[-.17,0,-.17],0,-16),asset(1,[.17,0,.17],0,16)];
  cases.push(assess('crossing from '+(sign>0?'front':'back'),assets,()=>sign>0?[0,1]:[1,0]));
 }
 view(1);
 cases.push(assess('three depths in a single draw',[asset(0,[0,0,-.31]),asset(1,[0,0,.02]),asset(2,[0,0,.17])],()=>[0,1,2],true));
 const leafy=asset(1,[.48,0,.21]);
 leafy.parts[0].marks.push({id:'leaf-overlap',kind:'ribbon',materialId:'dye1',root:[0,.65,0],axis:[-1,0,0],up:[0,0,1],length:.94,width:.12,curl:.08,flex:.6});
 cases.push(assess('folded leaf in front of a stem',[asset(0,[0,0,-.16]),leafy],()=>[0,1],true));
 view(-1);
 cases.push(assess('stem in front of a folded leaf',[asset(0,[0,0,-.16]),leafy],()=>[1,0],true));
 view(1);
 const angle=21,offset=.68*Math.tan(angle*Math.PI/180);
 const tilted=[asset(0,[0,0,-offset],angle),asset(2,[0,0,offset],-angle)];
 // The same two stems exchange depths on opposite sides of the crossing.
 // Exclude the physical intersection where the material volumes interpenetrate.
 cases.push(assess('inclined crossing, lower half',tilted,p=>Math.floor(p/size)<size/2-9?[0,1]:null,true));
 cases.push(assess('inclined crossing, upper half',tilted,p=>Math.floor(p/size)>size/2+9?[1,0]:null,true));
 // A solid between two reeds must clip the rear reed alone, including at
 // soft foreground edges. Match the foreground plus card to the actual draw.
 const occluder=new T.Scene(),card=new T.Mesh(new T.PlaneGeometry(3,3),new T.MeshBasicMaterial({color:0x244064}));
 card.position.set(0,.68,0);occluder.add(card);
 setup([asset(0,[0,0,-.12]),asset(1,[0,0,.12])],false);
 const frontOnly=read(1,false,occluder),both=read(null,false,occluder),bare=read(null);
 let max=0,checked=0;
 for(let i=0;i<bare.length;i+=4)if(bare[i+3]>15){
  checked++;for(let k=0;k<4;k++)max=Math.max(max,Math.abs(both[i+k]-frontOnly[i+k]));
 }
 cases.push({name:'opaque depth between reeds',overlap:checked,max,pass:checked>30&&max<=2});
 card.geometry.dispose();card.material.dispose();
 // Leave the two-tone inclined crossing visible for inspection.
 setup(tilted,true);renderer.setRenderTarget(null);renderer.autoClear=true;reeds.draw(renderer,camera,0);
 const glError=renderer.getContext().getError();target.dispose();reeds.dispose();renderer.dispose();
 return {pass:cases.every(c=>c.pass)&&glError===0,format:bytePath?'byte':'adapter default',glError,cases};
}
try{document.querySelector('#result').textContent=JSON.stringify(check(),null,2);}
catch(e){document.querySelector('#result').textContent=String(e.stack??e);}
</script>
