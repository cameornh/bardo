<!doctype html><html><meta charset="utf-8"><style>pre{height:130px;overflow:auto;margin:4px}canvas{display:block}</style><body style="background:#252a2c;color:white;font:13px monospace;margin:0"><button id="normal">Laminar flow 1 — run 6 s</button><button id="fast">Laminar maximum flow — run 6 s</button><button id="continue">Continue another 6 s</button><button id="turbulent">Turbulent maximum flow — run 6 s</button><button id="verify">Compare GPU / CPU</button><pre id="result">Ready</pre><script type="module">
import * as THREE from 'three';
import {WaterLab} from '../src/water-lab.js';import {WaterLabRenderer} from '../src/water-lab-renderer.js';import {MotionDetail} from '../src/lod.js';import {QUAD_VERTEX,TONEMAP_FRAGMENT} from '../src/shaders.js';
import {LabWaterField} from '../src/water-lab-field.js';
import {parcelDensity} from '../src/parcel-field.js';
const r=new THREE.WebGLRenderer({preserveDrawingBuffer:true});r.autoClear=false;r.setSize(900,600);document.body.append(r.domElement);r.debug.onShaderError=(gl,p,v,f)=>{throw Error(gl.getShaderInfoLog(f)||gl.getProgramInfoLog(p));};
const lab=new WaterLab(r),camera=new THREE.PerspectiveCamera(43,900/600,.01,300),target=new THREE.WebGLRenderTarget(900,600,{type:THREE.FloatType}),output=new THREE.Scene();output.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({glslVersion:THREE.GLSL3,vertexShader:QUAD_VERTEX,fragmentShader:TONEMAP_FRAGMENT,uniforms:{uImage:{value:target.texture}},depthTest:false,depthWrite:false})));
const field={renderer:r,camera,target,output,quadCamera:new THREE.Camera(),resolution:new THREE.Vector2(900,600),motion:new MotionDetail(),minPixelSigma:2,uniforms:{uView:{value:0},uSHDegree:{value:3}},water:{uniforms:{uWaterRoughness:{value:.07},uTurbidity:{value:.02}}}};for(const k of ['beach','grass','grains','soft','optics','lightTest'])field[k]={count:0};const view=new WaterLabRenderer(field,lab);view.adaptiveResolution=false;
const result=document.getElementById('result');camera.position.set(.5,4.5,10);camera.lookAt(-2.8,2,0);function draw(){camera.updateMatrixWorld();view.render({dt:1/30,adaptive:false});}draw();
async function run(flow,turbulence,reset=true){try{
 if(reset){lab.configure('pipe');lab.flow=flow;lab.turbulence=turbulence;lab.wetting.enabled=false;lab.detail.density=.3;}
 const start=performance.now(),end=lab.time+6,volume=lab.volume,checkpoints=[];let steps=0,next=lab.time+.5;
 while(lab.time<end){const dt=lab.timestep;lab.step(dt);if(++steps%8===0){draw();result.textContent=`Simulating ${lab.time.toFixed(2)} / ${end.toFixed(0)} seconds`;await new Promise(requestAnimationFrame);}
  if(lab.time>=next){draw();const centers=[];for(const [id,tag]of lab.pipeLayers||[])if(tag.lane===2&&lab.positions[id*4+1]>.8)centers.push({p:Array.from(lab.positions.subarray(id*4,id*4+3)),layer:tag.layer});centers.sort((a,b)=>a.layer-b.layer);let minimum=Infinity,segments=0;for(let n=1;n<centers.length;n++)if(centers[n].layer-centers[n-1].layer===1){segments++;for(let j=0;j<9;j++){const t=j/8,p=centers[n].p.map((x,k)=>x*t+centers[n-1].p[k]*(1-t));minimum=Math.min(minimum,parcelDensity(view.items,p,'water').density);}}checkpoints.push({t:lab.time,minimumDensity:minimum,segments});next+=.5;}
 }
 draw();result.textContent=JSON.stringify({backend:lab.gpu.cpu?'CPU':'GPU',flow:lab.flow,turbulence:lab.turbulence,time:lab.time,steps,elapsedMs:performance.now()-start,volumeDrift:lab.volume-volume,parcels:lab.count,kernels:view.items.length,checkpoints,continuousStream:checkpoints.every(x=>x.minimumDensity>.18&&x.segments>0),pass:lab.positions.every(Number.isFinite)&&(lab.turbulence>0?checkpoints.some(x=>x.minimumDensity<.18):checkpoints.every(x=>x.minimumDensity>.18&&x.segments>0))},null,2);
}catch(e){result.textContent=e.stack;}}
document.getElementById('normal').onclick=()=>run(1,0);document.getElementById('fast').onclick=()=>run(2,0);document.getElementById('continue').onclick=()=>run(lab.flow,lab.turbulence,false);document.getElementById('turbulent').onclick=()=>run(2,2);
document.getElementById('verify').onclick=async()=>{try{result.textContent=JSON.stringify({constraints:lab.verify(),field:await LabWaterField.verify(r)},null,2);}catch(e){result.textContent=e.stack;}};
</script></body></html>
